<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options & Stock Trade Journal</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 1550px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        input, select, button { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #2563eb; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; color: #cbd5e1; margin-top: 10px; }
        th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #0f172a; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
        .gain { color: #10b981; font-weight: bold; }
        .loss { color: #ef4444; font-weight: bold; }
        .notes-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <h2>📖 Options & Stock Trade Journal</h2>
        <a href="index.html">← Back to Portfolio Heatmap</a>
    </div>

    <!-- Trade Input Form -->
    <div class="card">
        <h3 id="formTitle">Log Trade Entry</h3>
        <div class="grid">
            <div>
                <label for="symbol">Stock</label>
                <input type="text" id="symbol" placeholder="e.g. AAPL, TSLA" style="text-transform: uppercase;">
            </div>
            <div>
                <label for="account">Account</label>
                <select id="account">
                    <option value="Regular">Regular</option>
                    <option value="Roth">Roth</option>
                </select>
            </div>
            <div>
                <label for="openDate">Opened</label>
                <input type="date" id="openDate">
            </div>
            <div>
                <label for="positionType">Position</label>
                <select id="positionType" onchange="toggleOptionFields()">
                    <option value="Shares">Shares</option>
                    <option value="Buy PUTs">Buy PUTs</option>
                    <option value="Sell PUTs">Sell PUTs</option>
                    <option value="Buy CALLs">Buy CALLs</option>
                    <option value="Sell CALLs">Sell CALLs</option>
                </select>
            </div>

            <div id="expirationContainer" class="hidden">
                <label for="expirationDate">Expiration</label>
                <input type="date" id="expirationDate">
            </div>
            <div id="strikeContainer" class="hidden">
                <label for="strike">Strike ($)</label>
                <input type="number" id="strike" placeholder="e.g. 150" step="any">
            </div>

            <div>
                <label for="markPrice">Mark ($ Live)</label>
                <div style="display: flex; gap: 4px;">
                    <input type="number" id="markPrice" placeholder="Price" step="any">
                    <button type="button" onclick="autoFetchMarkPrice()" style="width: auto; margin: 0; padding: 6px 10px; background: #334155; font-size: 0.75rem;" title="Fetch live stock price">
                        ⚡ Fetch
                    </button>
                </div>
            </div>
            <div>
                <label for="qty">QTY</label>
                <input type="number" id="qty" placeholder="Shares / Contracts" step="any">
            </div>
            <div>
                <label for="openPrice">Open Price ($)</label>
                <input type="number" id="openPrice" placeholder="Price paid" step="any">
            </div>

            <div>
                <label for="closeAction">Action</label>
                <select id="closeAction">
                    <option value="">Open Position</option>
                    <option value="Closed">Closed</option>
                    <option value="Expired">Expired</option>
                    <option value="Rolled">Rolled</option>
                </select>
            </div>
            <div>
                <label for="closeDate">Date Closed</label>
                <input type="date" id="closeDate">
            </div>
            <div>
                <label for="closePrice">Close Price ($)</label>
                <input type="number" id="closePrice" placeholder="Exit price" step="any">
            </div>
        </div>

        <div style="margin-top: 10px;">
            <label for="notes">Trade Notes / Strategy Thesis</label>
            <input type="text" id="notes" placeholder="Strategy notes, delta, profit targets..." style="width: 100%;">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="saveBtn" onclick="saveTrade()">Save Trade Entry</button>
            <button id="cancelBtn" onclick="resetForm()" class="hidden" style="background: #64748b; width: auto;">Cancel Edit</button>
        </div>
    </div>

    <!-- Journal Table -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;">
            <h3 style="margin: 0;">Trade History Log</h3>
            <button id="refreshMarksBtn" onclick="refreshOpenMarks()" style="width: auto; margin: 0; background: #3b82f6; padding: 6px 14px; font-size: 0.85rem; white-space: nowrap;">
                🔄 Refresh Open Marks (>5m old)
            </button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Stock</th>
                        <th>Account</th>
                        <th>Opened</th>
                        <th>Position</th>
                        <th>Expiration</th>
                        <th>Strike</th>
                        <th>Mark</th>
                        <th>QTY</th>
                        <th>Open Price</th>
                        <th>Open Value</th>
                        <th>Status</th>
                        <th>Date Closed</th>
                        <th>Close Price</th>
                        <th>Close Value</th>
                        <th>Profit/Loss</th>
                        <th>Days Held</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="journalTableBody">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://axxupkvohtvztezkhfcu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fWd6AHYNhR7oOAQ5OnHV5A_MpgLKdP3';
const FINNHUB_API_KEY = 'd9nv2f9r01qqbd5s8ptgd9nv2f9r01qqbd5s8pu0';
const FIVE_MINUTES_MS = 5 * 60 * 1000;

let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let trades = JSON.parse(localStorage.getItem('trade_journal')) || [];
let editingId = null;

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

function toggleOptionFields() {
    const pos = document.getElementById('positionType').value;
    const isOption = pos !== 'Shares';
    document.getElementById('expirationContainer').classList.toggle('hidden', !isOption);
    document.getElementById('strikeContainer').classList.toggle('hidden', !isOption);
}

// Single Field Live Fetch for Form
async function autoFetchMarkPrice() {
    const symbol = document.getElementById('symbol').value.trim().toUpperCase();
    const markInput = document.getElementById('markPrice');

    if (!symbol) return alert('Enter a Stock ticker first.');
    markInput.placeholder = 'Fetching...';

    try {
        const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
        const data = await res.json();
        
        if (data && data.c > 0) {
            document.getElementById('markPrice').value = data.c.toFixed(2);
        } else {
            alert(`Could not fetch live price for ${symbol}.`);
        }
    } catch (e) {
        alert('Network error fetching stock price.');
    } finally {
        markInput.placeholder = 'Price';
    }
}

// 🔄 Staggered Bulk Refresh for Open Positions (>5 min old)
async function refreshOpenMarks() {
    const btn = document.getElementById('refreshMarksBtn');
    if (!btn) return;

    const originalText = btn.innerText;
    const now = Date.now();

    // Filter only open trades whose mark was updated > 5 min ago (or never)
    const openTradesToRefresh = trades.filter(t => {
        const isOpen = !t.close_action;
        const lastUpdated = t.mark_updated || 0;
        return isOpen && (now - lastUpdated > FIVE_MINUTES_MS);
    });

    if (openTradesToRefresh.length === 0) {
        alert('All open positions have been updated within the last 5 minutes!');
        return;
    }

    btn.disabled = true;
    btn.style.opacity = '0.7';

    // Get unique ticker symbols to minimize API requests
    const uniqueSymbols = [...new Set(openTradesToRefresh.map(t => t.symbol.toUpperCase().trim()))];
    const priceMap = {};
    let count = 0;

    try {
        for (let symbol of uniqueSymbols) {
            count++;
            btn.innerText = `⏳ Refreshing (${count}/${uniqueSymbols.length})...`;

            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
            const data = await res.json();

            if (data && data.c > 0) {
                priceMap[symbol] = data.c;
            }

            // Stagger API calls by 300ms to stay within rate limits
            if (count < uniqueSymbols.length) await sleep(300);
        }

        let updatedCount = 0;

        // Apply new mark prices to matching trades
        for (let t of trades) {
            if (!t.close_action) {
                const symbolKey = t.symbol.toUpperCase().trim();
                if (priceMap[symbolKey]) {
                    t.mark_price = priceMap[symbolKey];
                    t.mark_updated = Date.now();
                    updatedCount++;

                    // Sync updated mark to Supabase
                    if (supabaseClient) {
                        await supabaseClient.from('trade_journal')
                            .update({ mark_price: t.mark_price, mark_updated: t.mark_updated })
                            .eq('id', t.id);
                    }
                }
            }
        }

        localStorage.setItem('trade_journal', JSON.stringify(trades));
        renderJournalTable();
        alert(`✅ Refreshed Mark prices for ${updatedCount} open position(s)!`);

    } catch (err) {
        console.error('Refresh failed:', err);
        alert('⚠️ Refresh interrupted due to network or rate limits.');
    } finally {
        btn.innerText = originalText;
        btn.disabled = false;
        btn.style.opacity = '1';
    }
}

// Math Calculations
function calculateValues(t) {
    const isOption = t.position_type !== 'Shares';
    const multiplier = isOption ? 100 : 1;
    const feePerContract = 0.60;

    const qty = parseFloat(t.qty) || 0;
    const openPrice = parseFloat(t.open_price) || 0;

    let rawOpenVal = qty * openPrice * multiplier;
    let openFee = isOption ? (qty * feePerContract) : 0;
    
    const isCredit = t.position_type === 'Sell PUTs' || t.position_type === 'Sell CALLs';
    let openValue = isCredit ? (rawOpenVal - openFee) : (rawOpenVal + openFee);

    let closeValue = null;
    let profitLoss = null;
    let daysHeld = null;

    if (t.close_action && t.close_date) {
        const start = new Date(t.open_date);
        const end = new Date(t.close_date);
        daysHeld = Math.max(0, Math.ceil((end - start) / (1000 * 60 * 60 * 24)));

        if (t.close_action === 'Expired') {
            closeValue = 0;
            profitLoss = isCredit ? openValue : -openValue;
        } else if (t.close_price !== null && t.close_price !== undefined && !isNaN(parseFloat(t.close_price))) {
            const closePrice = parseFloat(t.close_price);
            let rawCloseVal = qty * closePrice * multiplier;
            let closeFee = (isOption && closePrice >= 0.05) ? (qty * feePerContract) : 0;

            closeValue = isCredit ? (rawCloseVal + closeFee) : (rawCloseVal - closeFee);
            profitLoss = isCredit ? (openValue - closeValue) : (closeValue - openValue);
        }
    }

    return { openValue, closeValue, profitLoss, daysHeld };
}

async function loadTrades() {
    if (supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            const { data, error } = await supabaseClient.from('trade_journal').select('*').order('open_date', { ascending: false });
            if (!error && data) trades = data;
        }
    }
    renderJournalTable();
}

async function saveTrade() {
    const symbol = document.getElementById('symbol').value.trim().toUpperCase();
    const account = document.getElementById('account').value;
    const openDate = document.getElementById('openDate').value;
    const positionType = document.getElementById('positionType').value;
    const isOption = positionType !== 'Shares';

    const expirationDate = isOption ? document.getElementById('expirationDate').value : null;
    const strike = isOption ? (parseFloat(document.getElementById('strike').value) || null) : null;
    const markPrice = parseFloat(document.getElementById('markPrice').value) || null;
    const qty = parseFloat(document.getElementById('qty').value) || 0;
    const openPrice = parseFloat(document.getElementById('openPrice').value) || 0;

    const closeAction = document.getElementById('closeAction').value || null;
    const closeDate = document.getElementById('closeDate').value || null;
    const closePriceInput = document.getElementById('closePrice').value;
    const closePrice = closePriceInput !== "" ? parseFloat(closePriceInput) : null;
    const notes = document.getElementById('notes').value.trim() || null;

    if (!symbol || !openDate || qty <= 0 || openPrice < 0) {
        alert('Please complete all required opening trade fields.');
        return;
    }

    const tempTrade = { symbol, account, open_date: openDate, position_type: positionType, expiration_date: expirationDate, strike, mark_price: markPrice, qty, open_price: openPrice, close_action: closeAction, close_date: closeDate, close_price: closePrice, notes, mark_updated: Date.now() };
    const computed = calculateValues(tempTrade);

    const tradeData = {
        ...tempTrade,
        open_value: computed.openValue,
        close_value: computed.closeValue,
        profit_loss: computed.profitLoss,
        days_held: computed.daysHeld
    };

    if (supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            if (editingId) {
                await supabaseClient.from('trade_journal').update(tradeData).eq('id', editingId);
            } else {
                await supabaseClient.from('trade_journal').insert([{ ...tradeData, user_id: session.user.id }]);
            }
        }
    }

    resetForm();
    await loadTrades();
}

function editTrade(id) {
    const t = trades.find(item => item.id === id);
    if (!t) return;

    editingId = id;
    document.getElementById('symbol').value = t.symbol || '';
    document.getElementById('account').value = t.account || 'Regular';
    document.getElementById('openDate').value = t.open_date || '';
    document.getElementById('positionType').value = t.position_type || 'Shares';
    toggleOptionFields();

    document.getElementById('expirationDate').value = t.expiration_date || '';
    document.getElementById('strike').value = t.strike || '';
    document.getElementById('markPrice').value = t.mark_price || '';
    document.getElementById('qty').value = t.qty || '';
    document.getElementById('openPrice').value = t.open_price || '';
    document.getElementById('closeAction').value = t.close_action || '';
    document.getElementById('closeDate').value = t.close_date || '';
    document.getElementById('closePrice').value = t.close_price !== null && t.close_price !== undefined ? t.close_price : '';
    document.getElementById('notes').value = t.notes || '';

    document.getElementById('formTitle').innerText = '✏️ Edit Trade Entry';
    document.getElementById('saveBtn').innerText = 'Save Changes';
    document.getElementById('saveBtn').style.background = '#10b981';
    document.getElementById('cancelBtn').classList.remove('hidden');

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteTrade(id) {
    if (!confirm('Delete this trade log entry?')) return;
    if (supabaseClient) {
        await supabaseClient.from('trade_journal').delete().eq('id', id);
    }
    trades = trades.filter(t => t.id !== id);
    renderJournalTable();
}

function renderJournalTable() {
    const tbody = document.getElementById('journalTableBody');
    tbody.innerHTML = '';

    if (!trades || trades.length === 0) {
        tbody.innerHTML = `<tr><td colspan="18" style="text-align: center; padding: 20px; color: #64748b;">No trades logged yet.</td></tr>`;
        return;
    }

    trades.forEach(t => {
        const computed = calculateValues(t);

        const pnlDisplay = (computed.profitLoss !== null && computed.profitLoss !== undefined)
            ? `<span class="${computed.profitLoss >= 0 ? 'gain' : 'loss'}">$${computed.profitLoss.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</span>` 
            : '-';

        const safeId = typeof t.id === 'string' ? `'${t.id}'` : t.id;

        tbody.innerHTML += `
            <tr>
                <td><strong>${t.symbol || '-'}</strong></td>
                <td>${t.account || 'Regular'}</td>
                <td>${t.open_date || '-'}</td>
                <td>${t.position_type || 'Shares'}</td>
                <td>${t.expiration_date || '-'}</td>
                <td>${t.strike ? '$' + t.strike : '-'}</td>
                <td>${t.mark_price ? '$' + parseFloat(t.mark_price).toFixed(2) : '-'}</td>
                <td>${t.qty || 0}</td>
                <td>$${parseFloat(t.open_price || 0).toFixed(2)}</td>
                <td>$${computed.openValue ? computed.openValue.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : '-'}</td>
                <td>${t.close_action || 'Open'}</td>
                <td>${t.close_date || '-'}</td>
                <td>${(t.close_price !== null && t.close_price !== undefined && t.close_price !== '') ? '$' + parseFloat(t.close_price).toFixed(2) : '-'}</td>
                <td>${computed.closeValue !== null ? '$' + computed.closeValue.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : '-'}</td>
                <td>${pnlDisplay}</td>
                <td>${computed.daysHeld !== null ? computed.daysHeld + ' d' : '-'}</td>
                <td class="notes-cell" title="${t.notes || ''}">${t.notes || '-'}</td>
                <td>
                    <button style="padding: 2px 8px; width: auto; background: #3b82f6; margin-right: 4px; display: inline-block;" onclick="editTrade(${safeId})">Edit</button>
                    <button style="padding: 2px 8px; width: auto; background: #ef4444; display: inline-block;" onclick="deleteTrade(${safeId})">✕</button>
                </td>
            </tr>
        `;
    });
}

function resetForm() {
    editingId = null;
    document.getElementById('symbol').value = '';
    document.getElementById('openDate').value = '';
    document.getElementById('expirationDate').value = '';
    document.getElementById('strike').value = '';
    document.getElementById('markPrice').value = '';
    document.getElementById('qty').value = '';
    document.getElementById('openPrice').value = '';
    document.getElementById('closeAction').value = '';
    document.getElementById('closeDate').value = '';
    document.getElementById('closePrice').value = '';
    document.getElementById('notes').value = '';

    document.getElementById('formTitle').innerText = 'Log Trade Entry';
    document.getElementById('saveBtn').innerText = 'Save Trade Entry';
    document.getElementById('saveBtn').style.background = '#2563eb';
    document.getElementById('cancelBtn').classList.add('hidden');
}

loadTrades();
</script>

</body>
</html>
